            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .stats {
            margin-bottom: 20px;
            font-size: 14px;
            color: #a0a0a0;
        }
        
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        
        #grid-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            position: relative;
        }
        
        #grid {
            display: grid;
            gap: 2px;
            margin-top: 10px;
        }
        
        .token-cell {
            width: 8px;
            height: 8px;
            border-radius: 1px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .token-cell:hover {
            transform: scale(1.5);
            z-index: 10;
        }
        
        .type-user { background: #4a9eff; }
        .type-system { background: #ff6b6b; }
        .type-assistant { background: #51cf66; }
        .type-tools { background: #ffd43b; }
        .type-tool_use { background: #ff922b; }
        
        #tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 12px;
            max-width: 300px;
            z-index: 1000;
            border: 1px solid #444;
        }
        
        .context-usage {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        
        .usage-bar {
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }
        
        .usage-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff 0%, #51cf66 50%, #ff6b6b 100%);
            transition: width 0.3s;
        }
        
        .usage-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;

        const totalTokens = 543318;
        const maxTokens = 200000;
        
        // Calculate grid dimensions
        const cellsPerRow = Math.ceil(Math.sqrt(maxTokens / 10)); // Adjust divisor for density
        const cellSize = 8;
        const gap = 2;
        
        const grid = document.getElementById('grid');
        grid.style.gridTemplateColumns = `repeat(${cellsPerRow}, ${cellSize}px)`;
        
        // Create cells
        const cells = [];
        const tokensPerCell = Math.max(1, Math.floor(maxTokens / (cellsPerRow * cellsPerRow)));
        
        let currentSegmentIndex = 0;
        let currentSegmentTokensUsed = 0;
        
        for (let i = 0; i < cellsPerRow * cellsPerRow && i * tokensPerCell < totalTokens; i++) {
            const cell = document.createElement('div');
            cell.className = 'token-cell';
            
            // Determine which segment this cell belongs to
            const tokenPosition = i * tokensPerCell;
            
            while (currentSegmentIndex < segments.length && 
                   tokenPosition >= segments[currentSegmentIndex].end) {
                currentSegmentIndex++;
            }
            
            if (currentSegmentIndex < segments.length) {
                const segment = segments[currentSegmentIndex];
                cell.classList.add(`type-${segment.type}`);
                cell.dataset.segment = currentSegmentIndex;
                cell.dataset.tokens = tokensPerCell;
            }
            
            cells.push(cell);
            grid.appendChild(cell);
        }
        
        // Tooltip
        const tooltip = document.getElementById('tooltip');
        
        cells.forEach(cell => {
            cell.addEventListener('mouseenter', (e) => {
                const segmentIndex = parseInt(cell.dataset.segment);
                if (!isNaN(segmentIndex) && segments[segmentIndex]) {
                    const segment = segments[segmentIndex];
                    tooltip.innerHTML = `
                        <strong>${segment.type}</strong><br>
                        Tokens: ${segment.tokens}<br>
                        <hr style="border-color: #444; margin: 5px 0;">
                        ${segment.content}
                    `;
                    tooltip.style.opacity = '1';
                }
            });
            
            cell.addEventListener('mousemove', (e) => {
                tooltip.style.left = (e.pageX + 10) + 'px';
                tooltip.style.top = (e.pageY + 10) + 'px';
            });
            
            cell.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });
        });
