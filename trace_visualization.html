
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Trace Visualization</title>
    <style>
        body {
            font-family: sans-serif;
        }
        #tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>
    <h1>Claude Trace Visualization</h1>
    <div id="chart"></div>
    <div id="tooltip"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        const data = {
  "name": "Claude Trace",
  "children": [
    {
      "name": "Turn 1",
      "children": [
        {
          "name": "User Message",
          "value": 1,
          "content": "quota"
        },
        {
          "name": "Assistant Response",
          "value": 1,
          "content": "Here"
        }
      ]
    }
  ]
};
        const width = window.innerWidth;
        const height = window.innerHeight - 100;

        const treemap = d3.treemap()
            .size([width, height])
            .padding(1)
            .round(true);

        const root = d3.hierarchy(data)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);

        treemap(root);

        const svg = d3.select("#chart").append("svg")
            .attr("width", width)
            .attr("height", height);

        const color = d3.scaleOrdinal(d3.schemeCategory10);

        const leaf = svg.selectAll("g")
            .data(root.leaves())
            .join("g")
            .attr("transform", d => `translate(${d.x0},${d.y0})`);

        leaf.append("rect")
            .attr("id", d => (d.leafUid = d3.create("div").attr("id", "leaf").node()).id)
            .attr("fill", d => { while (d.depth > 1) d = d.parent; return color(d.data.name); })
            .attr("fill-opacity", 0.6)
            .attr("width", d => d.x1 - d.x0)
            .attr("height", d => d.y1 - d.y0);

        leaf.append("clipPath")
            .attr("id", d => (d.clipUid = d3.create("div").attr("id", "clip").node()).id)
            .append("use")
            .attr("xlink:href", d => d.leafUid.href);

        leaf.append("text")
            .attr("clip-path", d => d.clipUid)
            .selectAll("tspan")
            .data(d => d.data.name.split(/(?=[A-Z][^A-Z])/g))
            .join("tspan")
            .attr("x", 3)
            .attr("y", (d, i, nodes) => `${(i - nodes.length / 2 + 0.8) * 1.1}em`)
            .text(d => d);

        const tooltip = d3.select("#tooltip");

        leaf.on("mouseover", (event, d) => {
            tooltip.style("opacity", 1)
                .html(`<strong>${d.parent.data.name}: ${d.data.name}</strong><br>Tokens: ${d.data.value}<br><pre>${d.data.content.substring(0, 200)}...</pre>`);
        })
        .on("mousemove", (event) => {
            tooltip.style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY + 10) + "px");
        })
        .on("mouseout", () => {
            tooltip.style("opacity", 0);
        });

    </script>
</body>
</html>
